# Render Blueprint (https://render.com/docs/blueprint-spec) — a template, edit names/regions/plans first.
# Creates a managed PostgreSQL database and one Docker web service (web app + API on one origin).
databases:
  - name: night-ops-db
    databaseName: nightops
    plan: basic-256mb

services:
  - type: web
    name: night-ops-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: night-ops-db
          property: connectionString
      - key: APP_URL
        sync: false # set to your public URL, e.g. https://night-ops-scheduler.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
